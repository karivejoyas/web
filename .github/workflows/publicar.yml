# Arma la web desde el catálogo en vivo (Firestore) y la publica en GitHub Pages.
#
# Cuándo corre:
#  - con cada cambio en el repositorio y a mano ("Run workflow" o web.gs);
#  - todas las noches, siempre.
#  Los cambios del día (un producto del bot, un cupón, una foto…) los detecta
#  web.gs (Apps Script) cada 15 minutos y pide la publicación.
name: Publicar web

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 9 * * *'      # 05:30 / 06:30 en Chile: siempre publica
  workflow_dispatch:
    inputs:
      instagram:
        description: 'Últimas publicaciones de Instagram (las manda web.gs)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.firma.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: herramientas
      - id: firma
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "30 9 * * *" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ahora=$(python3 herramientas/firma.py || echo "")
          sitio=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url 2>/dev/null || echo "")
          publicada=$(curl -fsSL "${sitio%/}/firma.txt?t=$(date +%s)" 2>/dev/null | tr -d '\n' || echo "")
          echo "ahora:     $ahora"
          echo "publicada: $publicada"
          if [ -z "$ahora" ]; then echo "No se pudo leer la base; se revisa la próxima vez."; echo "publicar=false" >> "$GITHUB_OUTPUT"
          elif [ "$ahora" != "$publicada" ]; then echo "Cambiaron los datos: se publica."; echo "publicar=true" >> "$GITHUB_OUTPUT"
          else echo "Sin cambios."; echo "publicar=false" >> "$GITHUB_OUTPUT"; fi

  publicar:
    needs: revisar
    if: needs.revisar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow (fotos WebP) y ffmpeg (videos de Instagram)
        run: pip install --quiet pillow imageio-ffmpeg
      - name: Armar la web desde el catálogo
        env:
          IG_DATOS: ${{ inputs.instagram }}
        run: python3 construir.py
      - name: Revisar que salió completa
        run: |
          n=$(ls dist/p/*.html | wc -l)
          echo "fichas: $n"
          if [ "$n" -lt 20 ]; then echo "Salió muy poco contenido. No se publica."; exit 1; fi
      - name: Ver qué páginas cambiaron (para avisar a los buscadores)
        run: python3 herramientas/indexnow.py preparar
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: despliegue
        uses: actions/deploy-pages@v4
      - name: Avisar a Bing y otros buscadores (IndexNow)
        run: python3 herramientas/indexnow.py avisar
        continue-on-error: true
